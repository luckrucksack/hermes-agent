name: Sort Exec Probe

# TEMPORARY diagnostic (W2). Answers one question with runner evidence:
# does GNU sort on ubuntu-latest actually execute the program given to
# `--compress-program` when that program's name starts with '-', which is what
# tests/tools/test_execution_flag_detection.py
#   ::test_real_binaries_execute_leading_dash_program_payload[sort-args2-{bulk}-False]
# asserts? The test swallows the subprocess's stdout/stderr, so the failing run
# (42876455438) shows only FileNotFoundError on the marker. Deleted again in the
# same push that fixes the test.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Environment
        run: |
          sort --version | head -2
          . /etc/os-release && echo "os=$PRETTY_NAME"
          echo "runner=$RUNNER_OS $RUNNER_ARCH"
          echo "nproc=$(nproc)"

      - name: Exact test invocation
        run: |
          set -u
          work=$(mktemp -d)
          cat > "$work/-payload-marker" <<'PAYLOAD'
          #!/bin/sh
          printf executed > "$MARKER"
          cat
          PAYLOAD
          chmod 755 "$work/-payload-marker"
          seq 10000 -1 1 > "$work/input.txt"
          echo "--- payload ---"
          ls -l "$work/-payload-marker"
          echo "--- sort --buffer-size=1K --compress-program -payload-marker (10k lines) ---"
          PATH="$work:$PATH" MARKER="$work/executed" TERM=xterm \
            sort --buffer-size=1K --compress-program -payload-marker \
            < "$work/input.txt" > "$work/out.txt" 2> "$work/err.txt"
          rc=$?
          echo "exit=$rc"
          echo "--- stderr ---"
          sed -n '1,20p' "$work/err.txt"
          echo "--- marker ---"
          if [ -e "$work/executed" ]; then ls -l "$work/executed"; else echo "NO MARKER"; fi
          echo "--- stdout lines: $(wc -l < "$work/out.txt") ---"

      - name: Control A - program name without leading dash
        run: |
          set -u
          work=$(mktemp -d)
          cat > "$work/payload-marker" <<'PAYLOAD'
          #!/bin/sh
          printf executed > "$MARKER"
          cat
          PAYLOAD
          chmod 755 "$work/payload-marker"
          seq 10000 -1 1 > "$work/input.txt"
          PATH="$work:$PATH" MARKER="$work/executed" \
            sort --buffer-size=1K --compress-program payload-marker \
            < "$work/input.txt" > "$work/out.txt" 2> "$work/err.txt"
          echo "exit=$?"
          echo "--- stderr ---"; sed -n '1,10p' "$work/err.txt"
          echo "--- marker ---"
          if [ -e "$work/executed" ]; then ls -l "$work/executed"; else echo "NO MARKER"; fi

      - name: Control B - leading dash, no --buffer-size, 200k lines
        run: |
          set -u
          work=$(mktemp -d)
          cat > "$work/-payload-marker" <<'PAYLOAD'
          #!/bin/sh
          printf executed > "$MARKER"
          cat
          PAYLOAD
          chmod 755 "$work/-payload-marker"
          seq 200000 -1 1 > "$work/input.txt"
          PATH="$work:$PATH" MARKER="$work/executed" \
            sort --compress-program -payload-marker \
            < "$work/input.txt" > "$work/out.txt" 2> "$work/err.txt"
          echo "exit=$?"
          echo "--- stderr ---"; sed -n '1,10p' "$work/err.txt"
          echo "--- marker ---"
          if [ -e "$work/executed" ]; then ls -l "$work/executed"; else echo "NO MARKER"; fi

      - name: Control C - does sort treat -payload-marker as an option?
        run: |
          set -u
          work=$(mktemp -d)
          seq 5 -1 1 > "$work/input.txt"
          echo "--- sort --compress-program -payload-marker (tiny input, no spill) ---"
          sort --compress-program -payload-marker < "$work/input.txt" 2>&1 | sed -n '1,10p'
          echo "exit=${PIPESTATUS[0]}"
          echo "--- sort --compress-program=-payload-marker --help-ish probe ---"
          sort --compress-program=-payload-marker < "$work/input.txt" 2>&1 | sed -n '1,10p'
